name: Fetch F1 data
on:
  schedule:
    - cron: '0 6,18 * * 0,1'   # Sundays and Mondays only, 06:00 and 18:00 UTC
  workflow_dispatch:           # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Fetch results
        run: |
          if [ -f scripts/fetch-f1.js ]; then node scripts/fetch-f1.js; else echo "No fetch script yet, skipping"; fi
      - name: Commit if data changed
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || (git commit -m "Update F1 data" && git push)
